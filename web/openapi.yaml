openapi: 3.1.0
info:
  title: Jacobian Fiber Runtime API
  version: 0.4.0
  description: Tenant-scoped API for certified world and assumption fibers, exact finite-domain guarantees, and revocable proof-gated decisions.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Authenticated key and tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /keys:
    get:
      operationId: listApiKeys
      responses:
        "200":
          description: Tenant API-key metadata; secret material is never returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKey"
      responses:
        "201":
          description: API-key metadata; the caller retains the submitted token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
  /keys/events:
    get:
      operationId: listApiKeyEvents
      responses:
        "200":
          description: Append-only API-key management events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyEvent"
  /keys/{keyId}/revoke:
    post:
      operationId: revokeApiKey
      parameters:
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked API-key metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
  /system/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          description: Runtime and verifier capabilities
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /cases:
    get:
      operationId: listCases
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Tenant cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      operationId: createCase
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCase"
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMutation"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
  /cases/{caseId}:
    get:
      operationId: getCaseSnapshot
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Materialized case, evidence, branches, events, and audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
  /cases/{caseId}/evidence:
    post:
      operationId: addEvidence
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEvidence"
      responses:
        "201":
          description: Evidence committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceMutation"
        "409":
          $ref: "#/components/responses/Conflict"
  /cases/{caseId}/evidence/likelihood:
    post:
      operationId: applyLikelihoodEvidence
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyLikelihoodEvidence"
      responses:
        "201":
          description: Evidence and normalized Bayesian posterior committed atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MutationEnvelope"
                  - type: object
                    properties:
                      resource:
                        $ref: "#/components/schemas/BayesianUpdate"
  /cases/{caseId}/observations:
    post:
      operationId: recordObservation
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordObservation"
      responses:
        "201":
          description: Observation and evidence committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceMutation"
  /cases/{caseId}/fiber/materialize/jacobian:
    post:
      operationId: materializeJacobianFiber
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_case_version]
              properties:
                expected_case_version:
                  type: integer
      responses:
        "201":
          description: Complete certified algebraic fiber materialized as active branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiberTransitionMutation"
  /cases/{caseId}/fiber/advance/jacobian:
    post:
      operationId: advanceJacobianFiber
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceJacobianFiber"
      responses:
        "201":
          description: Observation, certified successor fiber, and globally matched sheet lineage committed atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiberTransitionMutation"
  /cases/{caseId}/branches:
    post:
      operationId: proposeBranch
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeBranch"
      responses:
        "201":
          description: Proposed branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchMutation"
  /branches/{branchId}/validate:
    post:
      operationId: validateBranch
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateBranch"
      responses:
        "200":
          description: Validated or contradicted branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchMutation"
  /branches/{branchId}/verify/jacobian:
    post:
      operationId: verifyJacobianBranch
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_case_version]
              properties:
                expected_case_version:
                  type: integer
      responses:
        "200":
          description: Branch carrying exact verifier certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchMutation"
  /branches/{branchId}/prune:
    post:
      operationId: pruneBranch
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PruneBranch"
      responses:
        "200":
          description: Contradicted branch retained in lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchMutation"
  /branches/{branchId}/split:
    post:
      operationId: splitBranch
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, candidates, certificate, expected_case_version]
              properties:
                reason:
                  type: string
                candidates:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/BranchCandidate"
                evidence_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                certificate:
                  type: object
                expected_case_version:
                  type: integer
      responses:
        "200":
          description: Proposed child branches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MutationEnvelope"
                  - type: object
                    properties:
                      resource:
                        type: array
                        items:
                          $ref: "#/components/schemas/Branch"
  /cases/{caseId}/branches/merge:
    post:
      operationId: mergeBranches
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_ids, label, state, reason, certificate, expected_case_version]
              properties:
                branch_ids:
                  type: array
                  minItems: 2
                  items:
                    type: string
                    format: uuid
                label:
                  type: string
                state: {}
                reason:
                  type: string
                evidence_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                certificate:
                  type: object
                expected_case_version:
                  type: integer
      responses:
        "200":
          description: Proposed merged branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchMutation"
  /cases/{caseId}/assumptions:
    post:
      operationId: proposeAssumption
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeAssumption"
      responses:
        "201":
          description: Persistent assumption branch proposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssumptionMutation"
  /assumptions/{assumptionId}/validate:
    post:
      operationId: validateAssumption
      parameters:
        - $ref: "#/components/parameters/AssumptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateAssumption"
      responses:
        "200":
          description: Assumption activated or contradicted; contradiction suspends dependent guarantees and revokes permits atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssumptionMutation"
  /cases/{caseId}/guarantees:
    post:
      operationId: createGuarantee
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuarantee"
      responses:
        "201":
          description: Exact finite-domain guarantee declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuaranteeMutation"
  /guarantees/{guaranteeId}/search/exhaustive:
    post:
      operationId: searchGuarantee
      parameters:
        - $ref: "#/components/parameters/GuaranteeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionGuard"
      responses:
        "200":
          description: Complete exact proof or certified counterexample
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuaranteeTransitionMutation"
  /guarantees/{guaranteeId}/counterexamples:
    post:
      operationId: submitCounterexample
      parameters:
        - $ref: "#/components/parameters/GuaranteeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignment, source, expected_case_version]
              properties:
                assignment:
                  type: object
                  additionalProperties:
                    type: integer
                source:
                  type: string
                  maxLength: 256
                expected_case_version:
                  type: integer
      responses:
        "200":
          description: Exact witness accepted, guarantee contradicted, and dependent permits revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuaranteeTransitionMutation"
  /cases/{caseId}/actions/authorize:
    post:
      operationId: authorizeAction
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeAction"
      responses:
        "200":
          description: Durable authorized or denied joint-maximin decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionAuthorizationMutation"
  /cases/{caseId}/decisions/evaluate:
    post:
      operationId: evaluateActions
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateActions"
      responses:
        "200":
          description: Ranked actions and selected policy result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /cases/{caseId}/experiments/rank:
    post:
      operationId: rankExperiments
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RankExperiments"
      responses:
        "200":
          description: Experiments sorted by information gain
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /cases/{caseId}/audit:
    get:
      operationId: verifyAudit
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Recomputed ledger report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"
  /cases/{caseId}/audit/semantic/jacobian:
    get:
      operationId: semanticJacobianAudit
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Fresh algebraic recomputation of active-fiber completeness and branch identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticFiberAudit"
  /cases/{caseId}/audit/semantic/guarantees:
    get:
      operationId: semanticGuaranteeAudit
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Fresh exact recomputation of guarantee proofs, witnesses, and authorization dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuaranteeSemanticAudit"
  /cases/{caseId}/events:
    get:
      operationId: listEvents
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - in: query
          name: after
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Ordered ledger events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque API key
  parameters:
    CaseId:
      in: path
      name: caseId
      required: true
      schema:
        type: string
        format: uuid
    BranchId:
      in: path
      name: branchId
      required: true
      schema:
        type: string
        format: uuid
    AssumptionId:
      in: path
      name: assumptionId
      required: true
      schema:
        type: string
        format: uuid
    GuaranteeId:
      in: path
      name: guaranteeId
      required: true
      schema:
        type: string
        format: uuid
    KeyId:
      in: path
      name: keyId
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Tenant-scoped resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Stale version, reused idempotency key, or invalid lifecycle transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Validation:
      description: Command violates a runtime invariant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Session:
      type: object
      required: [tenant_id, key_id, key_name, scopes]
      properties:
        tenant_id:
          type: string
          format: uuid
        key_id:
          type: string
          format: uuid
        key_name:
          type: string
        scopes:
          type: array
          items:
            type: string
    ApiKey:
      type: object
      required: [id, tenant_id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
    CreateApiKey:
      type: object
      required: [name, token, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        token:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [runtime:read, runtime:write, runtime:validate, "admin:keys"]
    ApiKeyEvent:
      type: object
      required: [id, tenant_id, actor_key_id, target_key_id, action, metadata, created_at]
      properties:
        id:
          type: integer
        tenant_id:
          type: string
          format: uuid
        actor_key_id:
          type: string
          format: uuid
        target_key_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [api_key.created, api_key.revoked]
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
    Case:
      type: object
      required: [id, tenant_id, name, observation, metadata, version, audit_event_count, audit_head_hash, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        observation: {}
        metadata:
          type: object
        version:
          type: integer
        audit_event_count:
          type: integer
        audit_head_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Evidence:
      type: object
      required: [id, tenant_id, case_id, kind, payload, source, observed_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        kind:
          type: string
        payload: {}
        source:
          type: string
        observed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Branch:
      type: object
      required: [id, tenant_id, case_id, label, state, weight, status, generation, parent_ids, validity, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        label:
          type: string
        state: {}
        weight:
          type: number
          minimum: 0
        status:
          type: string
          enum: [proposed, active, contradicted, superseded, merged, archived]
        generation:
          type: integer
          minimum: 0
        parent_ids:
          type: array
          items:
            type: string
            format: uuid
        validity:
          type: object
        risk_score:
          type: [number, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Assumption:
      type: object
      required: [id, tenant_id, case_id, label, statement, weight, status, generation, parent_ids, validity, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        label:
          type: string
        statement:
          type: object
        weight:
          type: number
          minimum: 0
        status:
          type: string
          enum: [proposed, active, contradicted, superseded, archived]
        generation:
          type: integer
          minimum: 0
        parent_ids:
          type: array
          items:
            type: string
            format: uuid
        validity:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Guarantee:
      type: object
      required: [id, tenant_id, case_id, label, description, verifier_id, specification, premise_assumption_ids, parent_ids, status, verification, counterexample_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        label:
          type: string
        description:
          type: string
        verifier_id:
          type: string
          const: jfr.finite-rational-refutation.v1
        specification:
          $ref: "#/components/schemas/FiniteDomainSpec"
        premise_assumption_ids:
          type: array
          items:
            type: string
            format: uuid
        parent_ids:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum: [proposed, verified, contradicted, suspended, superseded, archived]
        verification:
          type: object
        counterexample_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Counterexample:
      type: object
      required: [id, tenant_id, case_id, guarantee_id, verifier_id, witness, certificate, certificate_hash, source, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        guarantee_id:
          type: string
          format: uuid
        verifier_id:
          type: string
        witness:
          type: object

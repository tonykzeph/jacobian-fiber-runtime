    FiniteDomainSpec:
      type: object
      required: [variables, claim]
      description: Exact integer-domain theorem. Scalar constants are decimal or rational strings; the verifier evaluates them as arbitrary-precision rational numbers.
      properties:
        variables:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required: [name, minimum, maximum]
            properties:
              name:
                type: string
                pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$"
              minimum:
                type: integer
                minimum: -1000000
                maximum: 1000000
              maximum:
                type: integer
                minimum: -1000000
                maximum: 1000000
        premises:
          type: array
          items:
            $ref: "#/components/schemas/BooleanExpression"
        claim:
          $ref: "#/components/schemas/BooleanExpression"
    BooleanExpression:
      type: object
      required: [op]
      description: Tagged expression using less_than, less_than_or_equal, equal, not_equal, greater_than_or_equal, greater_than, all, any, or not.
      properties:
        op:
          type: string
          enum: [less_than, less_than_or_equal, equal, not_equal, greater_than_or_equal, greater_than, all, any, not]
      additionalProperties: true

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --locked --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo +1.94.0 check --locked --all-targets

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JFR_POSTGRES_PASSWORD: ci-postgres-password
      JFR_API_KEY_PEPPER: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JFR_BOOTSTRAP_API_KEY: jfr_live_ci_0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke-test commands
        run: sudo apt-get update && sudo apt-get install --yes jq uuid-runtime
      - name: Start production stack
        run: docker compose up --build --detach
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Exercise API, persistence, authorization, and concurrency
        run: ./scripts/e2e-smoke.sh
      - name: Preserve service logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: integration-logs
          path: compose.log
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

name: Bug report
description: Report a reproducible defect or invariant violation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities here. Use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.4.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the endpoint, command, lifecycle state, and exact error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Redact API keys, database URLs, and hidden-state data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, PostgreSQL version, and deployment mode.
    validations:
      required: true

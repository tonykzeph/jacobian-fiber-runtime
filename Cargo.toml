[package]
name = "jacobian-fiber-runtime"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false
description = "Production runtime for proof-carrying structured ambiguity"
repository = "https://github.com/tonykzeph/jacobian-fiber-runtime"
homepage = "https://github.com/tonykzeph/jacobian-fiber-runtime"
documentation = "https://github.com/tonykzeph/jacobian-fiber-runtime/tree/main/docs"
readme = "README.md"
keywords = ["formal-verification", "decision-systems", "rust", "runtime"]
categories = ["algorithms", "mathematics", "web-programming"]

[lib]
name = "jfr"
path = "src/lib.rs"

[[bin]]
name = "jfr-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["http1", "http2", "json", "macros", "tokio"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
mime_guess = "2.0.5"
num-bigint = { version = "0.4.6", features = ["serde"] }
num-complex = "0.4.6"
num-rational = { version = "0.4.2", features = ["serde"] }
num-traits = "0.2.19"
prometheus-client = "0.25.0"
rust-embed = "8.12.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_jcs = "0.2.0"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "uuid", "json", "migrate", "derive", "macros"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower = { version = "0.5.2", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-gzip", "cors", "fs", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["v4", "v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
